[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiforge-core"
version = "0.1.0"
description = "Shared LLM plumbing: provider router with fallback, versioned prompts, pgvector store, audit log, idempotency, FastAPI app factory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AbuBaker" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "google-genai>=1.0",
    "groq>=0.13",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["aiforge_core"]

[tool.hatch.build.targets.wheel.force-include]
"aiforge_core/migrations" = "aiforge_core/migrations"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
